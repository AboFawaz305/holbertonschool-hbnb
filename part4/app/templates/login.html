<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="static/styles.css">
</head>

<body>
    <header>
        <nav>
            <a href="/"><img src="static/images/logo.png" class="logo"></a>
            <a href="login.html" id="login-link" class="login-button">Login</a>
        </nav>
    </header>
    <main>
        <img class="main-logo" src="static/images/logo.png" alt="logo">
        <div class="form-div">
        <form class="modal-content rounded-4 shadow" id="login-form">
            <h2 class="display-4">Login</h2>
            <label for="email">Email:</label>
            <input class="form-control rounded-3 form-floating mb-3" type="email" id="email" name="email" required>
            <label for="password">Password:</label>
            <input class="form-control rounded-3 form-floating mb-3" type="password" id="password" name="password" required>
            <button class="btn btn-primary" type="submit">Login</button>
        </form>
        </div>
    </main>
    <footer>All Rights Reserved 2025 &copy;</footer>
    <script src="static/scripts.js"></script>
</body>

</html>
